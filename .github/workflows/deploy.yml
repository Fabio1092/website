name: Deploy zu Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Upload
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      - name: Auf Hostinger hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./domains/fr-makler.de/public_html/

      - name: TEMP diagnostic - HTTPS check
        run: |
          echo "--- HTTP -> HTTPS redirect check ---"
          curl -sSI http://fr-makler.de | head -20
          echo "--- HTTPS response headers ---"
          curl -sSI https://fr-makler.de | head -20
          echo "--- Certificate details ---"
          echo | openssl s_client -connect fr-makler.de:443 -servername fr-makler.de 2>/dev/null | openssl x509 -noout -subject -issuer -dates
          echo "--- www subdomain HTTPS ---"
          curl -sSI https://www.fr-makler.de | head -20
