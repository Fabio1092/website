name: Deploy zu Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Upload
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      - name: Diagnose - finale Pruefung fr-makler.de
        run: |
          curl -s --http1.1 https://fr-makler.de/ -o /tmp/live.html
          echo "=== cookie-consent (Anzahl Treffer) ==="
          grep -c "cookie-consent" /tmp/live.html || true
          echo "=== superchat (Anzahl Treffer) ==="
          grep -c "superchat" /tmp/live.html || true
          echo "=== default.php im Live-HTML? (sollte nicht der Fall sein) ==="
          grep -c "All Set to Go" /tmp/live.html || true

      - name: Auf Hostinger hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./domains/fr-makler.de/public_html/
