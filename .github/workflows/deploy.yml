name: Deploy zu Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Upload
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      - name: Diagnose - Cookie-Banner und Superchat pruefen
        run: |
          echo "=== HTTP-Status ==="
          curl -s -o /dev/null -w "HTTP-Status: %{http_code}\n" --http1.1 https://fr-makler.de/
          curl -s --http1.1 https://fr-makler.de/ -o /tmp/live.html
          echo "=== Body-Groesse ==="
          wc -c /tmp/live.html
          echo "=== cookie-consent (case-insensitiv) ==="
          grep -ic "cookie-consent" /tmp/live.html || true
          echo "=== superchat (case-insensitiv) ==="
          grep -ic "superchat" /tmp/live.html || true
          echo "=== Letzte 40 Zeilen des Bodys ==="
          tail -c 4000 /tmp/live.html

      - name: Auf Hostinger hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./domains/royalblue-magpie-425000.hostingersite.com/public_html/
