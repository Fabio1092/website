name: Deploy zu Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Upload
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      - name: Auf Hostinger hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./domains/fr-makler.de/public_html/

      - name: TEMP diagnostic - content served at user-reported IP
        run: |
          echo "--- Forcing connection to 82.25.96.147 for fr-makler.de ---"
          curl -sS --resolve fr-makler.de:443:82.25.96.147 https://fr-makler.de -o /tmp/page.html -D /tmp/headers.txt
          echo "--- Headers ---"
          cat /tmp/headers.txt
          echo "--- Title tag ---"
          grep -o '<title>[^<]*</title>' /tmp/page.html || echo "NO TITLE FOUND"
          echo "--- First h1 ---"
          grep -o '<h1[^>]*>[^<]*' /tmp/page.html | head -3
          echo "--- File size ---"
          wc -c /tmp/page.html
          echo "--- Contains 'astro' build marker? ---"
          grep -o 'astro-island\|Fabio Rumpf' /tmp/page.html | sort -u
