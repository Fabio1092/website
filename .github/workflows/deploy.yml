name: Deploy zu Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Upload
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      - name: Diagnose - www.fr-makler.de pruefen
        run: |
          echo "=== HTTP-Status ==="
          curl -s -o /dev/null -w "HTTP-Status: %{http_code}\n" --http1.1 https://www.fr-makler.de/ || echo "FEHLER"
          echo "=== Erste 15 Zeilen Body ==="
          curl -s --http1.1 https://www.fr-makler.de/ | head -15 || echo "FEHLER"

      - name: Auf Hostinger hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./domains/royalblue-magpie-425000.hostingersite.com/public_html/
