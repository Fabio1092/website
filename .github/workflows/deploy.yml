name: Deploy zu Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Upload
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      - name: Auf Hostinger hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./domains/fr-makler.de/public_html/

      - name: TEMP diagnostic - DNS resolution
        run: |
          echo "--- A records (fr-makler.de) via Google DNS ---"
          dig +short fr-makler.de @8.8.8.8
          echo "--- A records (www.fr-makler.de) via Google DNS ---"
          dig +short www.fr-makler.de @8.8.8.8
          echo "--- A records (fr-makler.de) via Cloudflare DNS ---"
          dig +short fr-makler.de @1.1.1.1
          echo "--- NS records ---"
          dig +short NS fr-makler.de @8.8.8.8
          echo "--- CNAME (www) ---"
          dig +short CNAME www.fr-makler.de @8.8.8.8
