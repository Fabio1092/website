name: Deploy zu Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Upload
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      - name: Auf Hostinger hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./domains/fr-makler.de/public_html/

      - name: TEMP diagnostic - check live site
        run: |
          echo "--- local build asset refs ---"
          grep -o '_astro/[a-zA-Z0-9_.]*\.\(js\|css\)' dist/index.html | sort -u
          echo "--- fr-makler.de ---"
          curl -s -o /tmp/live.html -w "HTTP %{http_code}\n" "https://fr-makler.de/?cachebust=$(date +%s)"
          echo "--- asset refs in live HTML ---"
          grep -o '_astro/[a-zA-Z0-9_.]*\.\(js\|css\)' /tmp/live.html | sort -u
          echo "--- headers ---"
          curl -sI "https://fr-makler.de/?cachebust=$(date +%s)" | grep -iE "last-modified|cache-control|etag|date|age"
          echo "--- www subdomain ---"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" https://www.fr-makler.de/
