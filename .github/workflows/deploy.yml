name: Deploy zu Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Upload
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      - name: Auf Hostinger hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./domains/fr-makler.de/public_html/

      - name: TEMP diagnostic - live status check
        run: |
          echo "--- fr-makler.de ---"
          curl -sI -o /tmp/h1.txt -w "HTTP %{http_code}\n" "https://fr-makler.de/?cachebust=$(date +%s)"
          cat /tmp/h1.txt
          echo "--- www.fr-makler.de ---"
          curl -sI -o /tmp/h2.txt -w "HTTP %{http_code}\n" "https://www.fr-makler.de/?cachebust=$(date +%s)"
          cat /tmp/h2.txt
          echo "--- http (no TLS) fr-makler.de ---"
          curl -sI -o /dev/null -w "HTTP %{http_code}\n" "http://fr-makler.de/"
          echo "--- DNS resolution ---"
          getent hosts fr-makler.de || nslookup fr-makler.de || true
          echo "--- body snippet ---"
          curl -s "https://fr-makler.de/?cachebust=$(date +%s)" | head -c 800
